<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>天空才是尽头 | 安全登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Inter","Segoe UI","Microsoft YaHei",sans-serif;color:#e2e8f0;overflow:hidden;
  background:
    radial-gradient(1200px 620px at 18% 12%, rgba(56,189,248,0.16), transparent 60%),
    radial-gradient(1000px 540px at 82% 88%, rgba(139,92,246,0.18), transparent 60%),
    radial-gradient(720px 420px at 66% 18%, rgba(52,211,153,0.10), transparent 55%),
    radial-gradient(900px 600px at 40% 95%, rgba(251,113,133,0.06), transparent 55%),
    #050b14}
.gwrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:2}
.grids{position:fixed;inset:0;pointer-events:none;opacity:.55;
  background-image:linear-gradient(rgba(56,189,248,.06) 1px,transparent 1px),
                    linear-gradient(90deg,rgba(56,189,248,.06) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 22%,transparent 72%);
  mask-image:radial-gradient(circle at 50% 40%,#000 22%,transparent 72%)}
.orb{position:fixed;border-radius:50%;filter:blur(60px);opacity:.35;pointer-events:none}
.orb1{width:340px;height:340px;left:-60px;top:-60px;background:rgba(56,189,248,.5)}
.orb2{width:280px;height:280px;right:-50px;bottom:-50px;background:rgba(139,92,246,.5)}
.orb3{width:180px;height:180px;right:28%;top:10%;background:rgba(52,211,153,.4)}
.box{position:relative;z-index:3;background:rgba(14,22,40,.82);border:1px solid rgba(56,189,248,.16);
  border-radius:20px;padding:42px 46px;width:min(400px,92vw);text-align:center;
  box-shadow:0 30px 90px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);backdrop-filter:blur(14px)}
.logo{width:76px;height:76px;margin:0 auto 18px;border-radius:50%;overflow:hidden;
  box-shadow:0 0 40px rgba(56,189,248,.4)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:21px;letter-spacing:.5px;margin-bottom:6px;
  background:linear-gradient(90deg,#38bdf8,#a78bfa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:#64748b;font-size:13px;margin-bottom:26px}
input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid rgba(56,189,248,.18);
  background:rgba(9,14,26,.85);color:#e2e8f0;font-size:16px;letter-spacing:2px;outline:none;text-align:center}
input:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.15)}
.gerr{height:22px;font-size:13px;color:#fb7185;margin-top:12px;line-height:22px}
button{width:100%;padding:14px;margin-top:8px;border:none;border-radius:12px;cursor:pointer;
  background:linear-gradient(135deg,#38bdf8,#a78bfa);color:#fff;font-size:16px;font-weight:600;font-family:inherit;
  transition:filter .15s}
button:hover{filter:brightness(1.1)}
.tfoot{color:#475569;font-size:11px;margin-top:22px;letter-spacing:.4px}
@keyframes pulse{0%,100%{opacity:.32}50%{opacity:.6}}
.orb2{animation:pulse 6s ease-in-out infinite}
</style></head><body>

// 手机端全角/半角归一化: 中文输入法打出的 ＠ Ａ 0 等转成半角 @ A 0
function norm(s){
  return (s||"").replace(/[！-～]/g,function(ch){return String.fromCharCode(ch.charCodeAt(0)-0xFEE0)})
                .replace(/　/g," ").trim();
}
function unlock(){
  var p=norm(document.getElementById("pwd").value);
  var d=document.getElementById("gerr");
  try{
    var key=CryptoJS.SHA256("clovis-gate:"+p);
    var full=CryptoJS.enc.Base64.parse(PAYLOAD);
    var iv=CryptoJS.lib.WordArray.create(full.words.slice(0,4),16);
    var ct=CryptoJS.lib.WordArray.create(full.words.slice(4),full.sigBytes-16);
    var dec=CryptoJS.AES.decrypt({ciphertext:ct},key,{iv:iv,mode:CryptoJS.mode.CBC,padding:CryptoJS.pad.Pkcs7});
    var txt=dec.toString(CryptoJS.enc.Utf8);
    if(txt.indexOf("CLOVIS1")!==0){throw 0}
    txt=txt.slice("CLOVIS1".length);
    document.open();
    document.write(txt);
    document.close();
  }catch(e){d.textContent="密码错误, 请重试";d.style.display="block";document.getElementById("pwd").focus()}
}
document.getElementById("btn").addEventListener("click",unlock);
document.getElementById("pwd").addEventListener("keydown",function(e){if(e.key==="Enter")unlock()});
</script>
